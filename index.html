
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Classifier</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>AI Image Classifier</h1>
    <p>Upload an image and let AI identify its contents.</p>

    <div id="dropzone" class="dropzone">
      <h3>Drag & Drop Your Image</h3>
      <p>or choose a JPEG or PNG file (max 5 MB)</p>
      <input id="file" type="file" accept="image/jpeg,image/png">
      <img id="preview" alt="Selected image preview" hidden>
    </div>

    <button id="predict">Analyze Image</button>
    <p id="status" role="status" aria-live="polite"></p>

    <section id="results" hidden>
      <h2>Prediction Results</h2>
      <h3 id="label"></h3>
      <p id="confidence"></p>
      <p id="inferenceTime"></p>
      <div id="top5"></div>
    </section>

    <section>
      <h2>Recent Predictions</h2>
      <button id="clearHistory" class="secondary">Clear History</button>
      <ul id="history"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
